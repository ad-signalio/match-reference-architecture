# KSA the SecretStore authenticates as. The GCP analogue of the ASCP chart's
# service account (which carried the eks.amazonaws.com/role-arn annotation) —
# here it carries the GKE Workload Identity annotation. The matching GSA +
# roles/iam.workloadIdentityUser binding are created in Terraform
# (tf-dt-workload-identity, use_existing_k8s_sa=true against this SA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
