# GCP Secret Manager store, authenticated via Workload Identity (the KSA above).
# Cloud-specific — the AWS equivalent would be provider.aws / SecretsManager.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ .Values.namespace }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectID }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.clusterLocation }}
          clusterName: {{ .Values.clusterName }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
