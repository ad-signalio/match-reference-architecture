{{- if .Values.s3.enabled }}
# GCS S3-interop HMAC creds -> "match-s3-credentials" (GCP-only; on AWS the app
# uses IRSA, so there is no static-credentials Secret and no ascp-support
# equivalent). Source: tf-dt-gcs-active-storage Secret Manager secret (sc-22742),
# JSON {access_id, secret}.
#
# The match chart reads S3_ACCESS_KEY <- access_key_id and S3_SECRET_KEY <-
# secret_access_key from this Secret (gated on s3.endpoint), pointing Active
# Storage's S3StreamingService at the GCS S3-interop XML API. Disable this when
# using native GCS + Workload Identity instead (no static creds needed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: match-s3
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.s3.k8sSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      remoteRef: { key: {{ .Values.s3.secretName }}, property: access_id }
    - secretKey: secret_access_key
      remoteRef: { key: {{ .Values.s3.secretName }}, property: secret }
{{- end }}
