# Docker registry creds -> "dockerconfig" (kubernetes.io/dockerconfigjson), same as ascp-support.
# Source: manually-created GCP Secret Manager secret holding the dockerconfigjson content.
# The {{ `...` }} wrapper escapes Helm so the inner {{ .dockerconfigjson }} reaches ESO's templater.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerconfig
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.k8sSecretNames.docker }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.secretNames.docker }}
