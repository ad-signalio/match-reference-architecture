# Honeybadger API key -> "honeybadger-api-key" (same k8s Secret as ascp-support).
# Source: manually-created GCP Secret Manager secret holding the plain API key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: honeybadger-api-key
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.k8sSecretNames.honeybadger }}
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: {{ .Values.secretNames.honeybadger }}
