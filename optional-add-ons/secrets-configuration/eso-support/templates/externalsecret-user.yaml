# Owning user password -> match-owning-user-credentials (same k8s Secret as ascp-support).
# Source: GCP Secret Manager secret from tf-dt-application-secrets (sc-22740).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: match-owning-user-credentials
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.k8sSecretNames.user }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: {{ .Values.secretNames.user }}, property: password }
