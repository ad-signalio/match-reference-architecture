# Memorystore / Redis -> "<clusterName>-redis" (same k8s Secret as ascp-support).
# Source: GCP Secret Manager secret from tf-dt-memorystore (sc-22520), JSON {host,port,auth,url}.
#
# The match chart reads the connection URL from the "elasticache_url" key (via
# redisServerConfigMap/redisClientConfigMap), so we keep that key name across
# clouds for chart portability. tf-dt-memorystore's "url" is the full connection
# string (redis:// or rediss:// per the instance's TLS mode) -> map to
# elasticache_url. endpoint<-host and url<-url kept for parity with the AWS secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: match-redis
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.k8sSecretNames.redis | default (printf "%s-redis" .Values.clusterName) }}
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef: { key: {{ .Values.secretNames.redis }}, property: url }
    - secretKey: endpoint
      remoteRef: { key: {{ .Values.secretNames.redis }}, property: host }
    - secretKey: elasticache_url
      remoteRef: { key: {{ .Values.secretNames.redis }}, property: url }
    # Raw AUTH string — for consumers that need host+password separately (e.g. the
    # KEDA Redis trigger, which can't use a redis:// URL). Maps the tf-dt-memorystore
    # secret's "auth" property.
    - secretKey: password
      remoteRef: { key: {{ .Values.secretNames.redis }}, property: auth }
