# Memorystore / Redis -> "<clusterName>-redis" (same k8s Secret as ascp-support).
# Source: GCP Secret Manager secret from tf-dt-memorystore (sc-22520), JSON {host,port,auth,url}.
#
# NOTE: the app's k8s keys are url / elasticache_url / endpoint (AWS-branded). The
# GCP secret has no elasticache_url/endpoint, so we map url<-url, endpoint<-host,
# elasticache_url<-url. CONFIRM against what the app actually reads — the
# "elasticache_url" key may want generalising in the chart/app for GCP.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: match-redis
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.k8sSecretNames.redis | default (printf "%s-redis" .Values.clusterName) }}
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef: { key: {{ .Values.secretNames.redis }}, property: url }
    - secretKey: endpoint
      remoteRef: { key: {{ .Values.secretNames.redis }}, property: host }
    - secretKey: elasticache_url
      remoteRef: { key: {{ .Values.secretNames.redis }}, property: url }
